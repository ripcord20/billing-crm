<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1d4f91">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Control Remote Computer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="login" class="screen">
    <div class="head"><span class="dish">📡</span> Control Remote Computer</div>
    <div class="box">
      <p class="intro">Enter your partner’s ID and Password to control their computer</p>
      <form class="form" onsubmit="event.preventDefault();connectViewer()">
        <label for="sid">Partner ID</label>
        <input id="sid" class="field" inputmode="numeric" maxlength="14" placeholder="124 713 628" required autocomplete="off">
        <label for="spw">Password</label>
        <input id="spw" class="field" inputmode="numeric" maxlength="8" placeholder="86777" required autocomplete="off">
        <label for="relay">Server</label>
        <input id="relay" class="field" inputmode="url" placeholder="192.168.22.99:18789" autocomplete="off">
        <div class="actions">
          <button type="submit" class="connect">Connect</button>
        </div>
        <p class="err" id="err"></p>
      </form>
      <div class="status" id="idleSt"><span class="dot"></span> Ready to connect</div>
    </div>
  </div>

  <div id="desk" class="screen hidden">
    <header>
      <div class="desk-meta">
        <b id="deskId">—</b>
        <span id="deskSt" class="pill">Connecting…</span>
      </div>
      <button type="button" class="ghost" onclick="disconnectViewer()">Disconnect</button>
    </header>
    <div id="stage">
      <img id="frame" alt="Remote screen" draggable="false">
      <div id="wait">Waiting for host screen…</div>
    </div>
  </div>
  <script src="relayUrl.js"></script>
  <script src="app.js"></script>
</body>
</html>
