plugins {
    id 'com.android.application'
}

android {
    namespace 'id.fiberix.remote'
    compileSdk 34

    defaultConfig {
        applicationId "id.fiberix.remote"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("fiberix-release.keystore")
            storePassword "fiberixremote"
            keyAlias "fiberix"
            keyPassword "fiberixremote"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
