plugins {
    id 'com.android.application'
}

def releaseStore = file("${rootProject.projectDir}/keystore/fiberix-release.jks")

android {
    namespace 'id.fiberix.pelanggan'
    compileSdk 34

    defaultConfig {
        applicationId 'id.fiberix.pelanggan'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'app_start_url', 'https://fiberix.my.id/portal/login'
    }

    signingConfigs {
        release {
            if (releaseStore.exists()) {
                storeFile releaseStore
                storePassword 'fiberix-release'
                keyAlias 'fiberix'
                keyPassword 'fiberix-release'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStore.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ''
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
