# Gabungkan ke /etc/freeradius/3.0/proxy.conf
# Ganti CHANGE_ME dengan secret /radius BillingRadius di CORE (bukan password MySQL).

proxy server {
	default_fallback = no
}

home_server billingradius {
	type = auth+acct
	ipaddr = 172.20.1.1
	port = 1812
	secret = CHANGE_ME
	response_window = 6
	status_check = none
}

home_server_pool billingradius_pool {
	type = fail-over
	home_server = billingradius
}

realm BILLINGRADIUS {
	auth_pool = billingradius_pool
	acct_pool = billingradius_pool
	nostrip
}
